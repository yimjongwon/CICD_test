# cicd_test/.github/workflows/deploy.yml


name: "Terraform Apply(수동)"
on:
  workflow_dispatch: # 수동 실행 버튼

jobs:
  deploy:
    runs-on: [self-hosted, "${{ github.actor }}"] # 최신 ubuntu machine 을 잠시 빌려서 아래의 작업을 수행하겠다는 의미
    environment: ${{ github.actor }}
    permissions:
      contents: read
      issues: write
    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout Source Code
        uses: actions/checkout@v5
     
      # 2. terraform 환경 구성
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
     
      # 3. terraform Init & Apply
      - name: Terraform Init and Apply
        working-directory: ./infra/terraform # 폴더 지정
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
          TF_VAR_admin_ingress_cidr: ${{ secrets.IP }}
          TF_VAR_tailnet_name: ${{ secrets.TAILNET }}
          TF_VAR_tailscale_api_key: ${{ secrets.TS_API_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_TOKEN }}
          TF_VAR_domain_name: ${{ format('lockbank.{0}', secrets.DOMAIN) }}
          TF_VAR_route53_zone_name: ${{ secrets.DOMAIN }}
          TF_VAR_db_host_replica: ${{ secrets.REPLICA_IP }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_app_image: ${{ secrets.DOCKERHUB_USERNAME }}/lock-app:latest      
           # 컨테이너 보안키
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
        run: |
          # 🚀 [안전장치] GitHub Environment에 백엔드 설정(MY_BUCKET)이 없으면 즉시 차단
          if [ -z "${{ secrets.MY_BUCKET }}" ]; then
            echo "❌ 해당 개발자(${{ github.actor }})의 S3 Backend(MY_BUCKET) 설정이 GitHub Environment에 등록되어 있지 않아 배포를 중단합니다."
            exit 1
          fi

          # 테라폼 초기화 (현재 로그인한 팀원의 버킷과 테이블 주입)
          terraform init \
            -backend-config="bucket=${{ secrets.MY_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.MY_TABLE }}" \
            -backend-config="region=ap-northeast-2"

          # 인프라 배포 및 Blue/Green ASG 가동
          echo "수동 배포(apply)를 시작합니다."
          terraform apply --auto-approve

          # 🎯 [동적 IP 추적 치트키] 테라폼 output에서 ASG 이름을 가져옵니다.
          ASG_NAME=$(terraform output -json asg_names | jq -r '.blue')
          echo "🔍 ASG 이름($ASG_NAME)을 기반으로 현재 가동 중인 EC2의 실시간 사설 IP를 조회합니다."
          
          # AWS CLI를 사용하여 해당 ASG에 속한 인스턴스 ID를 찾고, 그 인스턴스의 Private IP를 동적으로 추출합니다.
          INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" --query "AutoScalingGroups[0].Instances[0].InstanceId" --output text)
          
          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "❌ 현재 ASG 내에 살아있는 앱 서버 인스턴스를 찾을 수 없습니다."
            exit 1
          fi
          echo "✅ 가동 중인 앱 서버 인스턴스 ID 발견: $INSTANCE_ID"
          
          # 🎯 [동적 IP 추적] AWS CLI를 통해 인스턴스의 순수 내부 사설 IP(10.0.x.x)를 직접 가로챕니다.
          echo "🔍 AWS CLI를 통해 인스턴스의 순수 내부 사설 IP(10.0.x.x) 선로를 추출합니다."
          APP_HOST=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].PrivateIpAddress" --output text)
          echo "🎯 최종 타겟 사설 선로 주소 확정: $APP_HOST"

          # 원격 커맨드 및 변수 세팅
          DB_PRIVATE_IP=$(terraform output -raw db_private_ip)
          APP_USER="ec2-user"
          SSH_KEY_PATH="./lb-key.pem" # 테라폼이 호스트에 뽑아놓은 프라이빗 키 파일

          # 키페어 파일 권한 보안 규격 준수 변경 (안 하면 SSH가 거부합니다)
          chmod 400 $SSH_KEY_PATH

          # 🎯 [핵심] mgmt ➡️ Bastion(10.0.1.68) ➡️ APP 서버($APP_HOST) 경로를 개척합니다.
          SSH_CMD="ssh -i $SSH_KEY_PATH -p 22 -o StrictHostKeyChecking=no -J $APP_USER@$BASTION_PRIVATE_IP $APP_USER@$APP_HOST"
          
          # 🎯 [포트 스위칭 무중단 핵심 스크립트]
          APP_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/lock-app:latest"
          echo "🔄 mgmt ➡️ 실제 APP 서버($APP_HOST) 진입: 최신 이미지 기반 포트 롤링 배포를 지휘합니다."

          # 현재 가동 중인 컨테이너 조사 후 분기 처리
          if $SSH_CMD "sudo docker ps --format '{{.Names}}' | grep -q '^fastapi-blue$'"; then
            TARGET_COLOR="green"
            TARGET_PORT="8081"
            OLD_COLOR="blue"
            OLD_PORT="8080"
          else
            TARGET_COLOR="blue"
            TARGET_PORT="8080"
            OLD_COLOR="green"
            OLD_PORT="8081"
          fi

          echo "🚀 현재 구동 상태: [$OLD_COLOR] ➡️ 🎯 신규 타겟 진영: [$TARGET_COLOR] (포트: $TARGET_PORT)"

          # 1) 도커 허브에서 새로 빌드되어 덮어씌워진 latest 이미지를 강제로 Pull
          $SSH_CMD "sudo docker pull $APP_IMAGE"
          $SSH_CMD "sudo docker rm -f fastapi-$TARGET_COLOR >/dev/null 2>&1 || true"
          $SSH_CMD "sudo docker network create lb-net >/dev/null 2>&1 || true"
          
          # 2) 반대편 노는 포트에 먼저 안착 가동
          $SSH_CMD "sudo docker run -d --restart=always --net lb-net --name fastapi-$TARGET_COLOR -p $TARGET_PORT:$TARGET_PORT \
            -e DB_HOST_MAIN=$DB_PRIVATE_IP \
            -e DB_HOST_REPLICA=${{ secrets.REPLICA_IP }} \
            -e DB_USER=\"lb-user\" \
            -e DB_PASSWORD=\"${{ secrets.DB_PASSWORD }}\" \
            -e DB_NAME=\"lb-db\" \
            -e SECRET_KEY=${{ secrets.SECRET_KEY }} $APP_IMAGE"

          # 3) 신규 컨테이너 가동 웜업 대기 (502 에러 완전 예방)
          echo "⏳ 신규 컨테이너 안정화 대기 중..."
          sleep 7

          # 4) Nginx Upstream 타겟 스위칭 치환 (sed 마법)
          $SSH_CMD "sudo docker cp lockbank-nginx:/etc/nginx/nginx.conf /tmp/nginx.conf"
          $SSH_CMD "sed -i \"s/server fastapi-.*:.*;/server fastapi-$TARGET_COLOR:$TARGET_PORT;/g\" /tmp/nginx.conf"
          $SSH_CMD "sudo docker cp /tmp/nginx.conf lockbank-nginx:/etc/nginx/nginx.conf"

          # Nginx 0.001초 컷 무중단 리로드
          $SSH_CMD "sudo docker exec -u 0 lockbank-nginx nginx -s reload"
          echo "✅ Nginx 라우팅 스위칭 완료! 트래픽이 [$TARGET_COLOR] 포트로 흐릅니다."

          # 5) 사용이 끝난 구형 컨테이너 클린 청소
          $SSH_CMD "sudo docker rm -f fastapi-$OLD_COLOR >/dev/null 2>&1 || true"
          echo "🧹 구형 컨테이너(fastapi-$OLD_COLOR) 제거 완료."

          # [핵심 변환 로직] 도메인이 정상 출력되었는지 판단 후 OWASP ZAP용 타겟 URL 생성
          SVC_DOMAIN=$(terraform output -raw service_domain)
          
          if [ "$SVC_DOMAIN" = "N/A (HTTP only)" ] || [ -z "$SVC_DOMAIN" ]; then
            # HTTPS 도메인이 설정되지 않았다면 ALB의 순수 DNS 주소(HTTP)를 타겟으로 삼음
            ALB_DNS=$(terraform output -raw alb_dns_name)
            CURRENT_APP_URL="http://${ALB_DNS}"
          else
            # 도메인이 정상 작동 중이라면 해당 도메인 주소(HTTPS)를 타겟으로 삼음
            CURRENT_APP_URL="https://${SVC_DOMAIN}"
          fi

          # 1) 다음 스텝(OWASP ZAP)을 위해 파일에 환경변수 저장
          echo "APP_URL=${CURRENT_APP_URL}" >> $GITHUB_ENV

          # 제대로 담겼는지 깃허브 액션 콘솔에서 확인하기 위한 한 줄
          echo "🎯 타겟 APP_URL이 설정되었습니다: ${CURRENT_APP_URL}"

      # ==========================================
      # 🎯 [보안 최종단계] DAST: OWASP ZAP (동적 모의 해킹)
      # ==========================================
      # 앤서블이 서버를 무사히 가동했으므로, 살아있는 URL을 향해 공격을 찌릅니다.
      - name: Run OWASP ZAP Baseline Scan
      # 깃허브 API 변경점이 반영된 최신 안정 버전으로 교체합니다.
        uses: zaproxy/action-baseline@v0.14.0
        with:
          # AWS 로드밸런서(ALB) DNS 주소나 연동된 도메인 주소
          target: ${{ env.APP_URL }}
          
          # 만약 특정 취약점이 나왔을 때 파이프라인을 실패(레드카드)로 만들고 싶다면 true로 둡니다.
          # 처음 테스트할 때는 어떤 결과가 나오는지 보기 위해 false로 두고 관측해도 좋습니다.
          fail_action: false